name: TrashVPN
options:
  bundleIdPrefix: com.leo
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4LQT8WXV3K
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 10015
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: false
targets:
  TrashVPN:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ['*.entitlements', Licenses]
      - path: App/Licenses
        type: folder
        buildPhase: resources
      - path: Shared
      - path: Vendor/ClashAdapter/ProviderLifecycle.swift
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TrashVPN
        WARPKeychainGroup: $(AppIdentifierPrefix)com.leo.TrashVPN.shared
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leo.TrashVPN
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: icon
    dependencies:
      - target: Clash
        embed: true
      - target: PacketTunnel
        embed: true
  Clash:
    type: framework
    platform: iOS
    sources:
      - path: Core/ClashCore.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leo.TrashVPN.core
        DEFINES_MODULE: true
        MODULEMAP_FILE: Core/module.modulemap
        SKIP_INSTALL: true
        CLASH_CORE_SLICE[sdk=iphoneos*]: ios-arm64
        CLASH_CORE_SLICE[sdk=iphonesimulator*]: ios-arm64_x86_64-simulator
        CLASH_CORE_ARCHIVE: $(SRCROOT)/Vendor/Clash.xcframework/$(CLASH_CORE_SLICE)/Clash.framework/Clash
        OTHER_LDFLAGS: ['-Wl,-force_load,$(CLASH_CORE_ARCHIVE)', '-lresolv']
    info:
      path: Core/Info.plist
    preBuildScripts:
      - name: Copy official SDK headers
        script: |
          set -eu
          src="$SRCROOT/Vendor/Clash.xcframework/$CLASH_CORE_SLICE/Clash.framework/Headers"
          dst="$TARGET_BUILD_DIR/$PUBLIC_HEADERS_FOLDER_PATH"
          mkdir -p "$dst"
          for h in ref.h Clash.objc.h Universe.objc.h Clash.h; do
            cp -f "$src/$h" "$dst/$h"
          done
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(PUBLIC_HEADERS_FOLDER_PATH)/ref.h
          - $(TARGET_BUILD_DIR)/$(PUBLIC_HEADERS_FOLDER_PATH)/Clash.objc.h
          - $(TARGET_BUILD_DIR)/$(PUBLIC_HEADERS_FOLDER_PATH)/Universe.objc.h
          - $(TARGET_BUILD_DIR)/$(PUBLIC_HEADERS_FOLDER_PATH)/Clash.h
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes: ['*.entitlements']
      - path: Shared
      - path: Vendor/ClashAdapter
        excludes: [LICENSE]
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: TrashVPN
        WARPKeychainGroup: $(AppIdentifierPrefix)com.leo.TrashVPN.shared
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leo.TrashVPN.PacketTunnel
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        LD_RUNPATH_SEARCH_PATHS: ['$(inherited)', '@executable_path/Frameworks', '@executable_path/../../Frameworks']
    dependencies:
      - target: Clash
        embed: false
  TrashVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: TrashVPN
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  TrashVPNUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes: [WARPDeviceTests.swift, NewProtocolDeviceTests.swift, Stage2DeviceTests.swift, IPv6DeviceTests.swift]
    dependencies:
      - target: TrashVPN
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  TrashVPN:
    build:
      targets:
        TrashVPN: all
    test:
      targets: [TrashVPNTests, TrashVPNUITests]
